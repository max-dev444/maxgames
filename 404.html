<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - MaxGames</title>
    <!-- Favicon -->
    <link rel="icon" href="/Maxgames.orgfav.png" type="image/png">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            background: radial-gradient(circle at top, #1a1a2e, #0f0f1e);
            color: #fff;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            height:100vh;
            text-align:center;
            overflow:hidden;
        }
        h1 {
            font-size: 10rem;
            color: #ff3c78;
            margin-bottom:0.5rem;
            animation:bounce 1s infinite alternate;
        }
        p {
            font-size:1.5rem;
            margin-bottom:2rem;
            color:#f0f0f0;
        }
        .buttons {
            display:flex;
            gap:1rem;
            flex-wrap: wrap;
            justify-content:center;
        }
        .buttons a {
            text-decoration:none;
            color:#1a1a2e;
            background:#ff3c78;
            padding:0.8rem 2rem;
            border-radius:12px;
            font-weight:bold;
            transition:0.3s;
        }
        .buttons a:hover {
            background:#ff1e55;
            transform: scale(1.1);
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-20px); }
        }

        /* Stars */
        .stars {
            position:absolute;
            width:100%;
            height:100%;
            z-index:-1;
            overflow:hidden;
        }
        .star {
            position:absolute;
            background:white;
            border-radius:50%;
            width:2px;
            height:2px;
            animation:twinkle 2s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity:0.2; }
            100% { opacity:1; }
        }

        /* Fun little cursor effect */
        .cursor-follow {
            position:absolute;
            width:20px;
            height:20px;
            border-radius:50%;
            background:#ff3c78;
            pointer-events:none;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <h1>404</h1>
    <p>Lost in the MaxGames galaxy? Don’t worry, you can still play!</p>

    <div class="buttons">
        <a href="/play.html">🎮 Play</a>
        <a href="/read.html">📖 Read</a>
        <a href="/">🏠 Home</a>
    </div>

    <div class="cursor-follow"></div>

    <script>
        // Generate stars
        const starsContainer = document.querySelector('.stars');
        for(let i=0; i<120; i++){
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.top = Math.random()*100 + '%';
            star.style.left = Math.random()*100 + '%';
            const size = Math.random()*2+1;
            star.style.width = star.style.height = size+'px';
            star.style.animationDuration = 1 + Math.random()*2 + 's';
            starsContainer.appendChild(star);
        }

        // Cursor follow effect
        const cursor = document.querySelector('.cursor-follow');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
