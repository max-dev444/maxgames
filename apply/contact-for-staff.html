<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Step — Contact Owner</title>

<style>
body{
font-family: Arial, sans-serif;
background:#111;
color:white;
text-align:center;
padding:60px;
}

.box{
max-width:600px;
margin:auto;
background:rgba(255,255,255,0.08);
padding:30px;
border-radius:15px;
}

button{
padding:15px 30px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:#4bc6ff;
color:white;
margin-top:20px;
}

pre{
background:#000;
padding:15px;
border-radius:10px;
text-align:left;
overflow:auto;
}

iframe{
display:none;
}
</style>

</head>
<body>

<div class="box">

<h1>✅ LAST STEP</h1>
<p>Your application info will be sent to the owner.</p>

<h3>Preview Of Data Being Sent:</h3>
<pre id="preview"></pre>

<button onclick="openMail()">📧 Send Application Email</button>

<p>If your email app does not open, click the button again.</p>

</div>

<iframe id="mailFrame"></iframe>

<script>

// ===== GET SAVED DATA =====
function getData(){

return {
type: localStorage.getItem("applyType") || "Unknown",
first: localStorage.getItem("first") || "",
last: localStorage.getItem("last") || "",
email: localStorage.getItem("email") || "",
reason: localStorage.getItem("reason") || ""
};

}


// ===== BUILD EMAIL =====
function buildEmail(){

let d = getData();

let body = 
`STAFF APPLICATION

Application Type: ${d.type}

First Name: ${d.first}
Last Name: ${d.last}
Applicant Email: ${d.email}

Reason:
${d.reason}
`;

return {
mailto:
"mailto:maxplays494@gmail.com" +
"?subject=" + encodeURIComponent("Staff Application - " + d.type) +
"&body=" + encodeURIComponent(body),

preview: body
};

}


// ===== SHOW PREVIEW =====
function showPreview(){
let email = buildEmail();
document.getElementById("preview").textContent = email.preview;
}


// ===== OPEN EMAIL WITH FALLBACKS =====
function openMail(){

let email = buildEmail();
let link = email.mailto;

// Method 1
try{
window.location.href = link;
}catch(e){}

// Method 2
try{
window.open(link);
}catch(e){}

// Method 3 iframe fallback
try{
document.getElementById("mailFrame").src = link;
}catch(e){}
}


// ===== AUTO ATTEMPTS =====
function autoSend(){

openMail();

setTimeout(openMail,1500);
setTimeout(openMail,3500);
setTimeout(openMail,6000);

}


// ===== EXTRA FALLBACKS =====

// user click anywhere
document.body.addEventListener("click", openMail);

// keyboard press
document.addEventListener("keydown", openMail);


// ===== INIT =====
showPreview();
window.onload = autoSend;

</script>

</body>
</html>
