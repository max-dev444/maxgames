
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Application</title>

<style>
body{
font-family: Arial;
background:#8e0e00;
color:white;
text-align:center;
padding:40px;
}

.container{
background:rgba(255,255,255,0.1);
padding:30px;
border-radius:15px;
max-width:600px;
margin:auto;
}

input{
padding:10px;
margin:10px;
width:80%;
border-radius:8px;
border:none;
}

canvas{
background:white;
border-radius:8px;
margin:15px;
}

button{
padding:15px 30px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
background:#ff4b4b;
color:white;
}
</style>
</head>

<body>

<div class="container">
<h1>Admin Application</h1>

<input placeholder="First Name" id="first">
<input placeholder="Last Name" id="last">
<input placeholder="Email" id="email">
<input placeholder="Why do you want admin?" id="reason">

<h3>Security Captcha</h3>
<canvas id="captchaCanvas" width="220" height="90"></canvas>
<br>
<input placeholder="Enter captcha" id="captchaInput">

<br>
<button onclick="checkCaptcha()">Finish</button>

<div id="final" style="display:none;">
<h2>LAST STEP!</h2>
<button onclick="location.href='contact-for-staff.html'">
Send Email To Verify Application
</button>
</div>

</div>

<script>
let captchaText="";

function generateCaptcha(){
const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789abcdefghijklmnopqrstuvwxyz`~@#$%^&*()-_=+{[}]";
captchaText="";

for(let i=0;i<7;i++){
captchaText+=chars[Math.floor(Math.random()*chars.length)];
}

const canvas=document.getElementById("captchaCanvas");
const ctx=canvas.getContext("2d");

ctx.clearRect(0,0,220,90);
ctx.fillStyle="white";
ctx.fillRect(0,0,220,90);

// heavy noise
for(let i=0;i<20;i++){
ctx.strokeStyle=`rgba(0,0,0,${Math.random()*0.4})`;
ctx.beginPath();
ctx.moveTo(Math.random()*220,Math.random()*90);
ctx.lineTo(Math.random()*220,Math.random()*90);
ctx.stroke();
}

// random dots
for(let i=0;i<150;i++){
ctx.fillRect(Math.random()*220,Math.random()*90,1,1);
}

for(let i=0;i<captchaText.length;i++){
ctx.font="34px Arial";
ctx.fillStyle="black";

let x=28*i+15;
let y=50+Math.random()*25;

ctx.save();
ctx.translate(x,y);
ctx.rotate((Math.random()-0.5)*0.8);
ctx.fillText(captchaText[i],0,0);
ctx.restore();
}
}

function checkCaptcha(){
let val=document.getElementById("captchaInput").value.toUpperCase();

if(val===captchaText){
document.getElementById("final").style.display="block";
}else{
alert("Captcha wrong!");
generateCaptcha();
}
}

generateCaptcha();
</script>

</body>
</html>
