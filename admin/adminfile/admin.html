<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<style>
body {
    font-family: Verdana, sans-serif;
    background: #111;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
}

input {
    padding: 10px;
    margin: 5px;
    font-size: 16px;
}

button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}

.hidden {
    display: none;
}

#errorMsg {
    color: #f44;
    margin-top: 10px;
}
</style>
</head>
<body>

<h1 id="title">Admin Login</h1>

<div id="loginBox">
    <input type="email" id="email" placeholder="Admin Email"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <div id="errorMsg"></div>
</div>

<div id="adminPanel" class="hidden">
    <h2>Admin Panel</h2>
    <p>Access granted! You’ll see verified members in Step 3.</p>
</div>

<div id="noAccess" class="hidden">
    <h1>404</h1>
    <p>Page not found.</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Firebase Config
const firebaseConfig = {
  apiKey:"AIzaSyC39mabdSddFKYBfPeFiqXEH3vRuW0hBOg",
  authDomain:"verify-2f72e.firebaseapp.com",
  projectId:"verify-2f72e",
  storageBucket:"verify-2f72e.firebasestorage.app",
  messagingSenderId:"735887684811",
  appId:"1:735887684811:web:6d6275b949569d0f07974e"
};

// Your admin email
const ADMIN_EMAIL = "maxplays494@gmail.com"; // lowercase

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let attempts = 0;
const MAX_ATTEMPTS = 5;

// Login function
window.login = async function() {
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        if(user.email.toLowerCase() !== ADMIN_EMAIL){
            attempts++;
            handleFailedAttempt();
            return;
        }

        // success
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("adminPanel").classList.remove("hidden");
        document.getElementById("errorMsg").innerText = "";
    } catch(err) {
        attempts++;
        handleFailedAttempt();
    }
};

function handleFailedAttempt(){
    const remaining = MAX_ATTEMPTS - attempts;
    if(remaining <= 0){
        // permanently show fake 404
        document.body.innerHTML = document.getElementById("noAccess").innerHTML;
    } else {
        document.getElementById("errorMsg").innerText = 
            `Incorrect login! ${remaining} attempt(s) remaining.`;
    }
}

// Firebase Auth state check (just in case)
onAuthStateChanged(auth, user => {
    if(!user) return;

    if(user.email.toLowerCase() !== ADMIN_EMAIL){
        document.body.innerHTML = document.getElementById("noAccess").innerHTML;
        return;
    }

    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("adminPanel").classList.remove("hidden");
});
</script>

</body>
</html>
