<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
body {
    font-family: Verdana, sans-serif;
    background: #111;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
}

input {
    padding: 10px;
    margin: 5px;
    font-size: 16px;
}

button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}

.hidden { display: none; }

#errorMsg {
    color: #f44;
    margin-top: 10px;
}

#list {
    margin-top: 20px;
    width: 320px;
}
.emailItem {
    display: flex;
    justify-content: space-between;
    background: #222;
    padding: 8px;
    margin-bottom: 6px;
    border-radius: 6px;
}
</style>
</head>
<body>

<h1 id="title">Admin Login</h1>

<div id="loginBox">
    <input type="email" id="email" placeholder="Admin Email"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <div id="errorMsg"></div>
</div>

<div id="adminPanel" class="hidden">
    <h2>Admin Panel</h2>
    <p>Access granted! Verified members:</p>
    <div id="list"></div>
</div>

<div id="noAccess" class="hidden">
    <h1>404</h1>
    <p>Page not found.</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ---------------- FIREBASE CONFIG ----------------
const firebaseConfig = {
  apiKey:"AIzaSyC39mabdSddFKYBfPeFiqXEH3vRuW0hBOg",
  authDomain:"verify-2f72e.firebaseapp.com",
  projectId:"verify-2f72e",
  storageBucket:"verify-2f72e.firebasestorage.app",
  messagingSenderId:"735887684811",
  appId:"1:735887684811:web:6d6275b949569d0f07974e"
};

const ADMIN_EMAIL = "maxplays494@gmail.com"; // YOUR EMAIL

let attempts = 0;
const MAX_ATTEMPTS = 5;

let app, auth, db;

try {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);
} catch(e){
    document.body.innerHTML = `<h1 style="color:#f44">Firebase failed to initialize</h1><p>${e.message}</p>`;
}

// ---------------- LOGIN SYSTEM ----------------
window.login = async function(){
    if(!auth){
        alert("Auth not initialized!");
        return;
    }

    const emailInput = (document.getElementById("email").value || "").trim().toLowerCase();
    const passwordInput = document.getElementById("password").value;

    if(!emailInput || !passwordInput){
        document.getElementById("errorMsg").innerText = "Enter both email and password!";
        return;
    }

    try {
        const userCredential = await signInWithEmailAndPassword(auth, emailInput, passwordInput);
        const user = userCredential.user;

        if(!user || !user.email){
            throw new Error("Invalid Firebase user object");
        }

        if(user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
            attempts++;
            handleFailedAttempt();
            return;
        }

        // SUCCESS → show admin panel
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("adminPanel").classList.remove("hidden");
        loadVerifiedMembers();

    } catch(err){
        attempts++;
        handleFailedAttempt(err.message || "Unknown error");
    }
}

function handleFailedAttempt(msg){
    const remaining = MAX_ATTEMPTS - attempts;
    if(remaining <= 0){
        document.body.innerHTML = document.getElementById("noAccess").innerHTML;
    } else {
        document.getElementById("errorMsg").innerText = 
            `Incorrect login! ${remaining} attempt(s) remaining.${msg ? " ("+msg+")" : ""}`;
    }
}

// ---------------- LOAD VERIFIED MEMBERS ----------------
async function loadVerifiedMembers(){
    if(!db){
        document.getElementById("list").innerHTML = "<p style='color:#f44'>Firestore not initialized</p>";
        return;
    }

    const list = document.getElementById("list");
    list.innerHTML = "Loading...";

    try {
        const querySnapshot = await getDocs(collection(db, "verifiedEmails"));

        if(!querySnapshot || querySnapshot.empty){
            list.innerHTML = "<p>No verified members yet.</p>";
            return;
        }

        list.innerHTML = "";
        querySnapshot.forEach(d=>{
            try{
                const div = document.createElement("div");
                div.className = "emailItem";
                div.innerHTML = `
                    <span>${d.data()?.email || "Unknown"}</span>
                    <button onclick="deleteMember('${d.id}')">Delete</button>
                `;
                list.appendChild(div);
            } catch(inner){
                console.warn("Error rendering member:", inner);
            }
        });
    } catch(err){
        list.innerHTML = `<p style="color:#f44">Error loading members: ${err.message}</p>`;
    }
}

window.deleteMember = async function(id){
    if(!db) return;
    if(!id) return;
    try {
        if(confirm("Delete this verified member?")){
            await deleteDoc(doc(db,"verifiedEmails",id));
            loadVerifiedMembers();
        }
    } catch(e){
        alert("Delete failed: " + (e.message || "Unknown error"));
    }
}

// ---------------- AUTO LOGIN CHECK ----------------
try{
    onAuthStateChanged(auth, user=>{
        if(!user) return;

        if(!user.email || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
            document.body.innerHTML = document.getElementById("noAccess").innerHTML;
            return;
        }

        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("adminPanel").classList.remove("hidden");
        loadVerifiedMembers();
    });
} catch(e){
    console.error("Auth state listener failed:", e);
}
</script>

</body>
</html>
