<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>maxgames.org</title>
<link rel="icon" href="Maxgames.orgfav.png" />

<style>
body {
    margin: 0;
    font-family: Verdana, sans-serif;
    background: linear-gradient(135deg,#0f0f0f,#1a1a1a);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
}

/* MOBILE MODE */
body.mobile-mode h1 {
    font-size: 2em;
    text-align: center;
}

body.mobile-mode .buttons {
    grid-template-columns: 1fr;
}

body.mobile-mode button {
    width: 85vw;
    height: 80px;
    font-size: 1.3em;
}

h1 {
    margin-top: 50px;
    font-size: 3em;
    color: #f44;
    text-shadow: 3px 3px #000;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { text-shadow: 2px 2px #000; }
    50% { text-shadow: 5px 5px #f00; }
    100% { text-shadow: 2px 2px #000; }
}

.subtitle {
    font-size: 1.4em;
    color: #f77;
    margin-bottom: 40px;
    text-align: center;
    max-width: 650px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
    justify-content: center;
}

button {
    width: 220px;
    height: 90px;
    font-size: 1.6em;
    background: #222;
    color: #fff;
    border: 3px solid #f44;
    border-radius: 15px;
    cursor: pointer;
    transition: all .25s;
    box-shadow: 0 0 12px #f44;
}

button:hover {
    background: #f44;
    color: #000;
    transform: scale(1.07);
    box-shadow: 0 0 25px #f44;
}

footer {
    margin-top: auto;
    margin-bottom: 20px;
    color: #888;
}

.sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #f33;
    border-radius: 50%;
    animation: sparkle 3s infinite ease-in-out;
}

@keyframes sparkle {
    0% { opacity:1; transform:translateY(0px); }
    50% { opacity:.4; transform:translateY(-15px); }
    100% { opacity:1; transform:translateY(0px); }
}

/* Isabella Button */
#subbtn {
    position: fixed;
    bottom: 6px;
    right: 85px;
    font-size: 10px;
    padding: 2px 6px;
    background: transparent;
    color: #f44;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    opacity: .7;
}

#subbtn:hover { opacity: 1; }

/* NEW Mobile Support Button */
#mobilebtn {
    position: fixed;
    top: 6px;
    right: 85px;
    font-size: 11px;
    padding: 3px 7px;
    background: transparent;
    color: #f44;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    opacity: .7;
}

#mobilebtn:hover { opacity: 1; }

</style>
</head>

<body>

<button id="mobilebtn">Mobile Support</button>

<h1>Maxgames.org - FUN GAMES - V3.1</h1>

<div class="subtitle">
Created by MAX — play TMS, Element OS, Gamers Hub, and more.
</div>

<div class="buttons" id="mainButtons">
    <button onclick="window.open('play.html','_blank')">Play</button>
    <button onclick="window.open('Read.html')">Read</button>
    <button onclick="window.open('blockworld.html')">World of Blocks!</button>
    <button onclick="window.open('https://www.youtube.com/@Maxplaysalot')">Subscribe to Me!</button>
    <button onclick="window.open('https://xenon-explorer-b17f42ea.base44.app')">Talk to MaxGPT!</button>
    <button onclick="window.open('animalhomepage.html')">SAVE EARTH'S ANIMALS!</button>
    <button onclick="window.open('npppp.html')">NotePad+++</button>
  <button onclick="window.open('verify/verifystart.html')">Verify</button>

</div>

<footer>© 2025 Max — 67!!</footer>

<button id="subbtn" onclick="window.open('https://isabellalovesit.github.io/isabellalovesit.github.io')">
See my friend Isabella's site!
</button>

<script>
/* Mobile toggle */
document.getElementById("mobilebtn").onclick = () => {
    document.body.classList.toggle("mobile-mode");
};

/* Sparkles */
for(let i=0;i<60;i++){
    let s=document.createElement('div');
    s.className='sparkle';
    s.style.cssText=`
        left:${Math.random()*innerWidth}px;
        top:${Math.random()*innerHeight}px;
        width:${3+Math.random()*4}px;
        height:${3+Math.random()*4}px;
    `;
    document.body.appendChild(s);
}
</script>

</body>
</html>
