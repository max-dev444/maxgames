.tab:hover, .tab.active {

/* BUTTON GRID */
.buttons {

button {

button:hover {

/* FOOTER */

<script>
// TAB FUNCTIONALITY
const tabs = document.querySelectorAll('.tab');
const containers = document.querySelectorAll('.buttons-container');
tabs.forEach(tab => {
    tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const tabName = tab.getAttribute('data-tab');
        containers.forEach(c => c.style.display = (c.id === tabName) ? 'grid' : 'none');
    });
});

// VERIFIED MEMBERS FUNCTION
const firebaseConfig = {
    apiKey: "AIzaSyC39mabdSddFKYBfPeFiqXEH3vRuW0hBOg",

    projectId: "verify-2f72e",

    messagingSenderId: "735887684811",
    appId: "1:735887684811:web:6d6275b949569d0f07974"
};
const verifiedApp = firebase.initializeApp(firebaseConfig,'verifiedApp');
const db = firebase.firestore(verifiedApp);

document.getElementById('verifiedBtn').onclick = async () => {
    const panel = document.getElementById("verifiedPanel");
    if(panel.style.display === 'block'){ panel.style.display='none'; return; }
    panel.style.display = 'block';
    const list = document.getElementById("verifiedList");
    list.innerHTML = "Loading...";
    try{
        const snapshot = await db.collection("verifiedEmails").get();
        list.innerHTML = "";
        snapshot.forEach(doc => {
            const li = document.createElement("li");
            li.textContent = doc.data()?.email || "null@null.com";
            list.appendChild(li);
        });
    }catch(e){
        console.error(e);
        list.innerHTML = "<li>Error loading verified members</li>";
    }
};
</script>
